resolution.recommends.invalid={0} {1} は {2} の {3} を推奨していますが、その他の制約により読み込めません！
resolution.recommends.suggestion=快適にプレイするために、{2} の {3} を導入することをお勧めします。

resolution.breaks.invalid={0} {1} は {2} の {3} と互換性がありませんが、競合するバージョンが存在しています: {4}！
resolution.breaks.suggestion={0} の開発元によると、この組み合わせでは動作しません。いずれかのMODを削除するか、問題を解決するアップデートを確認してください。

resolution.conflicts.invalid={0} {1} は {2} の {3} と競合しています。現在存在するバージョン: {4}！
resolution.conflicts.suggestion=ゲームの起動自体は妨げられませんが、{0} の開発元によると、この組み合わせは問題を引き起こす可能性があります。いずれかのMODを削除するか、問題を解決するアップデートを確認することをお勧めします。

