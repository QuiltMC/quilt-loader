resolution.depends.invalid={0} {1} には {2} の {3} が必要ですが、その他の制約により読み込めません！
resolution.depends.suggestion={2} の {3} を導入する必要があります。

resolution.recommends.envDisabled={0} {1} は {2} の {3} を推奨していますが、この環境（クライアント/サーバー専用）では無効化されています！
