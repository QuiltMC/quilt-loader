# solution to install a mod that can load in the current environment: Install someMod, any version.
## oldMod newMod versionRange env
resolution.solution.replaceModEnvDisabled={0}을(를) 현재 환경({3})에서 불러올 수 있는 {1}의 {2} 버전으로 교체하거나, 해당 모드에 종속된 모드를 업데이트/제거하세요. 이는 특정 모드가 {3} 환경에서 로드되려 하지만 {3} 환경에서 로드될 수 없는 다른 모드에 종속되어 있기 때문에 발생합니다.
## mod version path
resolution.solution.replaceMod.oldMod={0} {1} ({2})
## mod version
resolution.solution.replaceMod.oldModNoPath={0} {1}

## mod version dep depVersionRange presentVersions presentVersionCount

resolution.depends.envDisabled={0} {1}은(는) {2}의 {3} 버전이 필요하지만, 이 환경(클라이언트/서버 전용)에서는 비활성화되어 있습니다!
resolution.depends.missing={0} {1}은(는) {2}의 {3} 버전이 필요하지만, 현재 누락되었습니다!
resolution.depends.mismatch={0} {1}은(는) {2}의 {3} 버전이 필요하지만, 잘못된 버전{5, choice, 1#만|2#들만} 존재합니다: {4}!
resolution.depends.invalid={0} {1}은(는) {2}의 {3} 버전이 필요하지만, 다른 제약 조건으로 인해 불러올 수 없습니다!
resolution.depends.suggestion={2}의 {3} 버전을 설치해야 합니다.

resolution.recommends.envDisabled={0} {1}은(는) {2}의 {3} 버전을 권장하지만, 이 환경(클라이언트/서버 전용)에서는 비활성화되어 있습니다!
resolution.recommends.missing={0} {1}은(는) {2}의 {3} 버전을 권장하지만, 현재 누락되었습니다!
resolution.recommends.mismatch={0} {1}은(는) {2}의 {3} 버전을 권장하지만, 잘못된 버전{5, choice, 1#만|2#들만} 존재합니다: {4}!
resolution.recommends.invalid={0} {1}은(는) {2}의 {3} 버전을 권장하지만, 다른 제약 조건으로 인해 불러올 수 없습니다!
resolution.recommends.suggestion=최적의 환경을 위해 {2}의 {3} 버전을 설치하는 것을 권장합니다.

resolution.breaks.invalid={0} {1}은(는) {2}의 {3} 버전과 호환되지 않지만, 충돌하는 버전이 설치되어 있습니다: {4}!
resolution.breaks.suggestion={0} 개발자에 따르면 이 조합은 작동하지 않습니다. 모드 중 하나를 제거하거나 문제를 해결하는 업데이트가 있는지 확인해야 합니다.

resolution.conflicts.invalid={0} {1}은(는) {2}의 {3} 버전과 충돌하며, 현재 다음 버전이 설치되어 있습니다: {4}!
resolution.conflicts.suggestion=게임 실행을 완전히 방해하지는 않지만, {0} 개발자에 따르면 이 조합은 문제를 일으킬 수 있습니다. 모드 중 하나를 제거하거나 문제를 해결하는 업데이트가 있는지 확인하는 것이 좋습니다.

